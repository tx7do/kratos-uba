syntax = "proto3";

package collector.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

import "uba/service/v1/report.proto";
import "uba/service/v1/feature_flag.proto";
import "uba/service/v1/visual_event.proto";

// 上报数据服务
service ReportService {
  // 提交事件（单条/批量）
  rpc PostReport(uba.service.v1.PostReportRequest) returns (uba.service.v1.PostReportResponse) {
    option (google.api.http) = {
      post: "/uba/v1/report"
      body: "*"
    };
  }

  // 健康检查
  rpc HealthCheck(google.protobuf.Empty) returns (HealthCheckResponse) {
    option (google.api.http) = {
      get: "/uba/v1/health"
    };
  }

  // 获取功能开关取值：为一个身份（设备/用户）评估该应用全部启用的开关
  rpc PostFlags(uba.service.v1.PostFlagsRequest) returns (uba.service.v1.PostFlagsResponse) {
    option (google.api.http) = {
      post: "/uba/v1/flags"
      body: "*"
    };
  }

  // 获取可视化埋点规则：SDK 拉取启用的"页面+元素XPath→事件"配置
  rpc ListVisualEvents(uba.service.v1.ListVisualEventsForAppRequest) returns (uba.service.v1.ListVisualEventsForAppResponse) {
    option (google.api.http) = {
      post: "/uba/v1/visual-events"
      body: "*"
    };
  }
}

message HealthCheckResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;

    OK = 1;         // 正常
    DEGRADED = 2;   // 降级
    DOWN = 3;       // 不可用
  }

  Status status = 1;
  int64 timestamp = 2;
}
